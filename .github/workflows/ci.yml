name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  build-e-testa:
    name: Build e smoke test da imagem
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint do Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

      - name: Build da imagem
        run: docker build -t portal:ci ./app

      - name: Sobe o container
        run: |
          docker run -d --name portal-ci -p 80:80 portal:ci
          for tentativa in $(seq 1 15); do
            if curl -fsS http://localhost >/dev/null; then
              echo "Container respondendo."
              exit 0
            fi
            sleep 2
          done
          echo "O container nao respondeu na porta 80."
          docker logs portal-ci
          exit 1

      - name: Encerra o container
        if: always()
        run: docker rm -f portal-ci || true

  terraform:
    name: Validacao do Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup do Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Formatacao
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Init sem backend
        working-directory: infra
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: infra
        run: terraform validate
